name: Debug Mordor records
on:
  push:
    paths:
      - '.github/workflows/debug-mordor.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -e
          curl -L --fail -o /tmp/MORDOR11.ZIP https://raw.githubusercontent.com/matteo-prosperi/DungeonsOfDejremake/main/tests/fixtures/MORDOR11.ZIP
          python3 - <<'PY'
          import io, zipfile
          with zipfile.ZipFile('/tmp/MORDOR11.ZIP') as z:
              n=next(x for x in z.namelist() if x.upper().endswith('MORDOR.WIP')); w=z.read(n)
          with zipfile.ZipFile(io.BytesIO(w)) as z:
              for fn,rl in [('MDATA2.MDR',75),('MDATA3.MDR',125),('MDATA5.MDR',160),('MDATA11.MDR',20)]:
                  n=next(x for x in z.namelist() if x.upper().endswith(fn)); b=z.read(n)
                  print('FILE',fn,'SIZE',len(b),'MOD',len(b)%rl)
                  for r in range(1,7):
                      o=(r-1)*rl
                      print('REC',r,b[o:o+min(80,rl)].hex())
          PY
