name: Build Mordor offline
on:
  push:
    paths:
      - '.github/workflows/build-mordor-offline.yml'
      - 'tools/build_mordor_static.py'
      - 'mordor-web/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static embedded game
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/MORDOR11.ZIP https://raw.githubusercontent.com/matteo-prosperi/DungeonsOfDejremake/main/tests/fixtures/MORDOR11.ZIP
          python3 tools/build_mordor_static.py /tmp/MORDOR11.ZIP mordor-web/index.html mordor-static/index.html
      - name: Commit generated build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mordor-static/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build pre-extracted Mordor web version'
          git push
