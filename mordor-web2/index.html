<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mordor Web — loader</title>
<style>html,body{margin:0;min-height:100%;background:#008080;font:14px Arial,sans-serif}.box{max-width:560px;margin:24px auto;background:#c0c0c0;border:2px outset #eee;padding:12px}.bar{height:18px;background:#fff;border:2px inset #eee;margin-top:10px}.bar i{display:block;height:100%;width:10%;background:#000080;transition:width .2s}button{margin-top:10px;min-height:40px;border:2px outset #eee;background:#c0c0c0;padding:6px 12px}</style>
<div class="box"><b>Preparing Mordor Web…</b><p id="s">Loading the browser build.</p><div class="bar"><i id="b"></i></div><button id="retry" hidden>Retry</button></div>
<script>
(()=>{
const OLD='https://raw.githack.com/modsandstuff/permadeath/a8dc20fca3c72b158254636fc992c00c85681638/mordor-web/index.html';
const status=document.getElementById('s'), bar=document.getElementById('b'), retry=document.getElementById('retry');
async function boot(){retry.hidden=true;bar.style.width='15%';status.textContent='Loading the game shell…';try{
 const r=await fetch(OLD,{cache:'force-cache'}); if(!r.ok) throw Error('game shell HTTP '+r.status); let html=await r.text(); bar.style.width='45%';
 const oldConst="const SHARE='https://raw.githubusercontent.com/matteo-prosperi/DungeonsOfDejremake/main/tests/fixtures/MORDOR11.ZIP';";
 const newConst="const SHARES=['https://raw.githack.com/matteo-prosperi/DungeonsOfDejremake/main/tests/fixtures/MORDOR11.ZIP','https://cdn.jsdelivr.net/gh/matteo-prosperi/DungeonsOfDejremake@main/tests/fixtures/MORDOR11.ZIP','https://raw.githubusercontent.com/matteo-prosperi/DungeonsOfDejremake/main/tests/fixtures/MORDOR11.ZIP'];";
 html=html.replace(oldConst,newConst);
 const oldAuto="async function autoLoad(){try{let res=await fetch(SHARE,{cache:'force-cache'});if(!res.ok)throw Error('HTTP '+res.status);readPackage(await res.arrayBuffer())}catch(e){$('#loadText').textContent='Automatic download failed: '+e.message;$('#manual').hidden=false;$('#prog').value=0}}";
 const newAuto=`async function autoLoad(){let last='';for(let n=0;n<SHARES.length;n++){let url=SHARES[n],ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{$('#loadText').textContent='Downloading shareware data — source '+(n+1)+' of '+SHARES.length+'…';$('#prog').value=10+n*6;let res=await fetch(url,{cache:'force-cache',signal:ctrl.signal});clearTimeout(timer);if(!res.ok)throw Error('HTTP '+res.status);let buf=await res.arrayBuffer();if(buf.byteLength<1000000)throw Error('download was incomplete');$('#loadText').textContent='Shareware downloaded. Opening data…';$('#prog').value=30;await readPackage(buf);return}catch(e){clearTimeout(timer);last=e.name==='AbortError'?'source timed out':e.message}}$('#loadText').textContent='Automatic download failed ('+last+'). You can still choose MORDOR11.ZIP manually below.';$('#manual').hidden=false;$('#prog').value=0}`;
 html=html.replace(oldAuto,newAuto);
 if(!html.includes('const SHARES='))throw Error('could not patch data source');
 bar.style.width='85%'; status.textContent='Starting Mordor…';
 document.open();document.write(html);document.close();
 }catch(e){bar.style.width='0%';status.textContent='Could not start: '+e.message;retry.hidden=false;}}
retry.addEventListener('click',boot);boot();
})();
</script>
